name: Build iOS App
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Verify project files
      run: |
        echo "=== Project root files ==="
        ls -la
        echo ""
        echo "=== Resources/ ==="
        ls -la Resources/
        echo ""
        echo "=== Resources/web/ ==="
        ls -la Resources/web/
        echo ""
        echo "=== iOS-SmartWebView-Info.plist ==="
        cat iOS-SmartWebView-Info.plist
        echo ""
        echo "=== iOS-SmartWebView.entitlements ==="
        cat iOS-SmartWebView.entitlements

    - name: Build without signing
      run: |
        xcodebuild archive \
          -project "iOS-SmartWebView.xcodeproj" \
          -scheme "Secondary Maintenance Scan" \
          -configuration Debug \
          -archivePath build/ios.xcarchive \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package unsigned IPA
      run: |
        mkdir -p build/Payload
        cp -r "build/ios.xcarchive/Products/Applications/Secondary Maintenance Scan.app" build/Payload/
        cd build
        zip -r "iOS-SmartWebView.ipa" Payload/
        rm -rf Payload
        echo "Unsigned IPA created at build/iOS-SmartWebView.ipa"
        ls -lh iOS-SmartWebView.ipa

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app
        path: build/*.ipa
