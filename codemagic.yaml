workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    environment:
      vars:
        XCODE_PROJECT: "iOS-SmartWebView.xcodeproj"
        XCODE_SCHEME: "Secondary Maintenance Scan"
        BUNDLE_ID: "com.example.iOSSmartWebView"
      xcode: 16.0
      cocoapods: default
    scripts:
      - name: Build without signing
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -archivePath build/ios.xcarchive \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Create export options
        script: |
          mkdir -p ios
          echo '<?xml version="1.0" encoding="UTF-8"?>' > ios/exportOptions.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ios/exportOptions.plist
          echo '<plist version="1.0">' >> ios/exportOptions.plist
          echo '<dict>' >> ios/exportOptions.plist
          echo '	<key>method</key>' >> ios/exportOptions.plist
          echo '	<string>development</string>' >> ios/exportOptions.plist
          echo '	<key>signingStyle</key>' >> ios/exportOptions.plist
          echo '	<string>manual</string>' >> ios/exportOptions.plist
          echo '	<key>signingCertificate</key>' >> ios/exportOptions.plist
          echo '	<string>-</string>' >> ios/exportOptions.plist
          echo '	<key>provisioningProfile</key>' >> ios/exportOptions.plist
          echo '	<string>-</string>' >> ios/exportOptions.plist
          echo '</dict>' >> ios/exportOptions.plist
          echo '</plist>' >> ios/exportOptions.plist
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/*.ipa
